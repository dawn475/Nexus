<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nexus — Roleplay Forum</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="supabase.js" onerror="document.getElementById('fatal-error-banner').style.display='block'; document.getElementById('fatal-error-banner').textContent='supabase.js was not found. Make sure you uploaded it to the same folder as index.html, with that exact filename.';"></script>
<script src="purify.min.js" onerror="document.getElementById('fatal-error-banner').style.display='block'; document.getElementById('fatal-error-banner').textContent='purify.min.js was not found. Custom post formatting has been disabled for safety.';"></script>

<style>
  :root{
    color-scheme:dark;

    --void:#0d0a0c;
    --void-soft:#120d10;

    --panel:#151013;
    --panel-raised:#1d1519;
    --panel-hover:#24191e;

    --line:#33252b;
    --line-soft:#251a1f;

    --accent:#8f3f50;
    --accent-dark:#632b38;
    --accent-soft:#bd7180;

    --gold:#b59a70;
    --gold-bright:#d5bd91;

    --parchment:#eee7df;
    --parchment-soft:#d7cdc4;

    --ink:#23191d;

    --muted:#94878c;
    --muted-light:#b0a4a8;

    --danger:#a94d55;
    --danger-text:#e4a6ab;

    --success:#63806d;

    --shadow:0 18px 50px rgba(0,0,0,.28);
    --shadow-soft:0 8px 26px rgba(0,0,0,.18);

    --display:'Cormorant Garamond', serif;
    --body:'Inter', sans-serif;
    --mono:'IBM Plex Mono', monospace;

    --radius:4px;
    --radius-large:7px;
  }

  html[data-theme="light"]{
    color-scheme:light;

    --void:#ede8e2;
    --void-soft:#e5ded7;

    --panel:#f8f4ef;
    --panel-raised:#fffaf5;
    --panel-hover:#f0e8e3;

    --line:#cfc2bd;
    --line-soft:#ddd2cd;

    --accent:#793747;
    --accent-dark:#552631;
    --accent-soft:#9c5765;

    --gold:#96774e;
    --gold-bright:#7c603f;

    --parchment:#2b2024;
    --parchment-soft:#44363b;

    --ink:#fffaf5;

    --muted:#76686d;
    --muted-light:#625459;

    --danger:#9f424c;
    --danger-text:#802f38;

    --success:#50735e;

    --shadow:0 18px 50px rgba(66,42,49,.08);
    --shadow-soft:0 7px 22px rgba(66,42,49,.07);
  }

  *{
    box-sizing:border-box;
  }

  html,
  body{
    margin:0;
    padding:0;
  }

  html{
    min-height:100%;
    background:var(--void);
  }

  body{
    min-height:100vh;

    background:
      radial-gradient(circle at 16% 0%, rgba(143,63,80,.08), transparent 34%),
      radial-gradient(circle at 100% 100%, rgba(181,154,112,.05), transparent 35%),
      var(--void);

    color:var(--parchment);
    font-family:var(--body);

    transition:
      background-color .25s ease,
      color .25s ease;
  }

  html[data-theme="light"] body{
    background:
      radial-gradient(circle at 16% 0%, rgba(121,55,71,.06), transparent 34%),
      radial-gradient(circle at 100% 100%, rgba(150,119,78,.05), transparent 35%),
      var(--void);
  }

  a{
    color:inherit;
  }

  button,
  input,
  textarea{
    font-family:var(--body);
  }

  button{
    cursor:pointer;
  }

  ::selection{
    background:var(--accent);
    color:#fff;
  }

  :focus-visible{
    outline:1px solid var(--accent-soft);
    outline-offset:3px;
  }

  /* ---------- layout shell ---------- */

  #app{
    display:none;
    min-height:100vh;
    grid-template-rows:auto 1fr;
  }

  #app.visible{
    display:grid;
  }

  /* ---------- topbar ---------- */

  header.topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:13px 26px;

    background:rgba(21,16,19,.94);

    border-bottom:1px solid var(--line-soft);

    position:sticky;
    top:0;
    z-index:20;

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);
  }

  html[data-theme="light"] header.topbar{
    background:rgba(248,244,239,.94);
  }

  .brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .brand .quill{
    color:var(--accent-soft);
    font-size:15px;
  }

  .brand h1{
    margin:0;

    color:var(--parchment);

    font-family:var(--display);
    font-size:28px;
    font-weight:600;

    letter-spacing:1.5px;
  }

  .topbar-right{
    display:flex;
    align-items:center;
    gap:11px;
  }

  /* ---------- currency ---------- */

  .seal{
    display:flex;
    align-items:center;
    gap:7px;

    padding:7px 11px;

    border:1px solid var(--line);
    border-radius:999px;

    background:var(--panel-raised);

    color:var(--gold-bright);

    font-family:var(--mono);
    font-size:12px;
    font-weight:500;
  }

  .seal .coin-icon{
    color:var(--gold);
    font-size:11px;
  }

  .username-pill{
    display:flex;
    align-items:center;
    gap:5px;

    color:var(--muted);

    font-family:var(--mono);
    font-size:11px;
  }

  .username-pill b{
    color:var(--parchment);
    font-weight:500;
  }

  /* ---------- theme toggle ---------- */

  .theme-toggle{
    display:grid;
    place-items:center;

    width:40px;
    height:40px;

    padding:0;

    border:1px solid var(--line);
    border-radius:50%;

    background:transparent;
    color:var(--parchment);

    font-family:var(--display);
    font-size:18px;

    transition:
      border-color .2s ease,
      background .2s ease,
      transform .2s ease;
  }

  .theme-toggle:hover{
    border-color:var(--accent);
    background:var(--panel-raised);
    transform:rotate(8deg);
  }

  /* ---------- buttons ---------- */

  .btn{
    min-height:42px;

    padding:9px 15px;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:var(--panel-raised);
    color:var(--parchment);

    font-size:13px;
    font-weight:500;

    transition:
      border-color .18s ease,
      background .18s ease,
      color .18s ease,
      transform .18s ease;
  }

  .btn:hover{
    border-color:var(--accent);
    background:var(--panel-hover);
  }

  .btn:active{
    transform:translateY(1px);
  }

  .btn-gold{
    border:1px solid var(--accent);
    background:var(--accent);
    color:#fff;
    font-weight:500;
  }

  .btn-gold:hover{
    border-color:var(--accent-soft);
    background:var(--accent-dark);
    filter:none;
  }

  .btn-ghost{
    background:transparent;
  }

  .btn-danger{
    border-color:var(--danger);
    color:var(--danger-text);
  }

  .btn:disabled{
    opacity:.45;
    cursor:not-allowed;
  }

  /* ---------- main layout ---------- */

  main.layout{
    display:grid;
    grid-template-columns:230px minmax(0,1fr);
    min-height:0;
  }

  /* ---------- sidebar ---------- */

  nav.sidebar{
    padding:26px 15px;

    border-right:1px solid var(--line-soft);

    background:
      linear-gradient(
        180deg,
        rgba(29,21,25,.45),
        transparent
      );
  }

  html[data-theme="light"] nav.sidebar{
    background:
      linear-gradient(
        180deg,
        rgba(255,250,245,.7),
        transparent
      );
  }

  nav.sidebar h2{
    margin:0 0 13px 9px;

    color:var(--muted);

    font-family:var(--mono);
    font-size:9px;
    font-weight:500;

    text-transform:uppercase;
    letter-spacing:2.1px;
  }

  .board-link{
    display:block;

    width:100%;

    margin-bottom:2px;
    padding:10px 11px;

    border:none;
    border-left:1px solid transparent;
    border-radius:0;

    background:none;
    color:var(--muted-light);

    text-align:left;

    font-family:var(--display);
    font-size:17px;

    transition:
      color .18s ease,
      background .18s ease,
      border-color .18s ease;
  }

  .board-link:hover{
    color:var(--parchment);
    background:var(--panel-raised);
  }

  .board-link.active{
    border-left-color:var(--accent);

    background:
      linear-gradient(
        90deg,
        rgba(143,63,80,.1),
        transparent
      );

    color:var(--parchment);

    box-shadow:none;
  }

  html[data-theme="light"] .board-link.active{
    background:
      linear-gradient(
        90deg,
        rgba(121,55,71,.09),
        transparent
      );
  }

  .sidebar-divider{
    height:1px;
    margin:20px 5px;
    background:var(--line-soft);
  }

  .sidebar-nav-btn{
    display:flex;
    align-items:center;
    gap:8px;

    width:100%;

    padding:9px 11px;

    border:none;
    border-radius:var(--radius);

    background:none;
    color:var(--muted);

    text-align:left;
    font-size:13px;
  }

  .sidebar-nav-btn:hover{
    background:var(--panel-raised);
    color:var(--parchment);
  }

  .sidebar-nav-btn.active{
    color:var(--accent-soft);
  }

  section.content{
    width:100%;
    max-width:1000px;
    padding:38px 42px 70px;
  }

  /* ---------- auth screen ---------- */

  #auth-screen{
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    padding:24px;
  }

  .letter{
    position:relative;

    width:100%;
    max-width:410px;

    padding:42px 38px;

    border:1px solid var(--line);
    border-radius:var(--radius-large);

    background:
      linear-gradient(
        145deg,
        rgba(143,63,80,.03),
        transparent 35%
      ),
      var(--panel);

    box-shadow:var(--shadow);
  }

  .letter::before{
    content:'N';

    position:absolute;

    top:-18px;
    right:26px;

    display:grid;
    place-items:center;

    width:38px;
    height:38px;

    border:1px solid var(--accent-dark);
    border-radius:50%;

    background:
      radial-gradient(
        circle at 35% 30%,
        var(--accent-soft),
        var(--accent-dark)
      );

    color:#f6e9e6;

    font-family:var(--display);
    font-size:16px;
    font-weight:700;

    box-shadow:0 5px 16px rgba(0,0,0,.25);
  }

  .letter h1{
    margin:0 0 5px;

    color:var(--parchment);

    font-family:var(--display);
    font-size:38px;
    font-weight:600;

    letter-spacing:2px;
  }

  .letter p.tagline{
    margin:0 0 29px;

    color:var(--muted);

    font-family:var(--display);
    font-size:15px;
    font-style:italic;
  }

  /* ---------- fields ---------- */

  .field{
    margin-bottom:16px;
  }

  .field label{
    display:block;

    margin-bottom:6px;

    color:var(--muted);

    font-family:var(--mono);
    font-size:9px;

    text-transform:uppercase;
    letter-spacing:1.5px;
  }

  .field input,
  .inline-form input{
    width:100%;

    padding:11px 12px;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:var(--void-soft);
    color:var(--parchment);

    font-size:14px;

    transition:
      border-color .18s ease,
      background .18s ease;
  }

  .field input:hover,
  .inline-form input:hover{
    border-color:var(--accent);
  }

  .field input:focus-visible,
  .inline-form input:focus-visible{
    border-color:var(--accent);
  }

  .auth-toggle{
    margin-top:18px;

    color:var(--muted);

    text-align:center;
    font-size:12px;
  }

  .auth-toggle button{
    padding:0;

    border:none;
    background:none;

    color:var(--accent-soft);

    font-family:inherit;
    font-size:inherit;
  }

  .auth-toggle button:hover{
    color:var(--parchment);
  }

  .auth-msg{
    display:none;

    margin-bottom:16px;
    padding:10px 12px;

    border-radius:var(--radius);

    font-size:12px;
  }

  .auth-msg.error{
    display:block;

    border:1px solid rgba(169,77,85,.45);

    background:rgba(169,77,85,.1);
    color:var(--danger-text);
  }

  .auth-msg.success{
    display:block;

    border:1px solid rgba(99,128,109,.35);

    background:rgba(99,128,109,.1);
    color:var(--success);
  }

  /* ---------- page headers ---------- */

  .page-header{
    display:flex;
    align-items:baseline;
    justify-content:space-between;

    flex-wrap:wrap;

    gap:12px;

    margin-bottom:25px;
    padding-bottom:15px;

    border-bottom:1px solid var(--line-soft);
  }

  .page-header h2{
    margin:0;

    color:var(--parchment);

    font-family:var(--display);
    font-size:31px;
    font-weight:600;

    letter-spacing:.4px;
  }

  .page-header .desc{
    margin-top:4px;

    color:var(--muted);

    font-family:var(--display);
    font-size:14px;
    font-style:italic;
  }

  /* ---------- boards ---------- */

  .board-card{
    position:relative;

    display:block;

    width:100%;

    margin-bottom:8px;
    padding:17px 18px 17px 22px;

    border:1px solid var(--line-soft);
    border-radius:var(--radius);

    background:
      linear-gradient(
        90deg,
        rgba(143,63,80,.03),
        transparent 35%
      ),
      var(--panel);

    text-align:left;

    transition:
      border-color .2s ease,
      background .2s ease,
      transform .2s ease;
  }

  .board-card::before{
    content:'';

    position:absolute;

    top:12px;
    bottom:12px;
    left:0;

    width:2px;

    background:transparent;

    transition:background .2s ease;
  }

  .board-card:hover{
    border-color:var(--accent);
    background:var(--panel-raised);
    transform:translateX(2px);
  }

  .board-card:hover::before{
    background:var(--accent);
  }

  .board-card h3{
    margin:0 0 3px;

    color:var(--parchment);

    font-family:var(--display);
    font-size:21px;
    font-weight:600;
  }

  .board-card p{
    margin:0;

    color:var(--muted);

    font-size:12px;
    line-height:1.5;
  }

  /* ---------- threads ---------- */

  .thread-row{
    display:flex;
    align-items:center;
    justify-content:space-between;

    width:100%;

    gap:12px;

    margin-bottom:6px;
    padding:14px 16px;

    border:1px solid var(--line-soft);
    border-radius:var(--radius);

    background:var(--panel);

    text-align:left;

    transition:
      border-color .18s ease,
      background .18s ease;
  }

  .thread-row:hover{
    border-color:var(--accent);
    background:var(--panel-raised);
  }

  .thread-main{
    display:flex;
    align-items:center;

    min-width:0;

    gap:10px;
  }

  .thread-title{
    overflow:hidden;

    color:var(--parchment);

    font-family:var(--display);
    font-size:19px;
    font-weight:500;

    text-overflow:ellipsis;
    white-space:nowrap;
  }

  .pin-badge{
    flex-shrink:0;

    color:var(--accent-soft);

    font-size:11px;
  }

  .thread-meta{
    flex-shrink:0;

    color:var(--muted);

    font-family:var(--mono);
    font-size:10px;

    white-space:nowrap;
  }

  /* ---------- posts ---------- */

  .back-link{
    margin-bottom:18px;
    padding:0;

    border:none;
    background:none;

    color:var(--muted);

    font-family:var(--mono);
    font-size:10px;

    letter-spacing:.3px;
  }

  .back-link:hover{
    color:var(--accent-soft);
  }

  .post-card{
    margin-bottom:12px;
    padding:18px 20px;

    border:1px solid var(--line-soft);
    border-radius:var(--radius-large);

    background:var(--panel);

    box-shadow:var(--shadow-soft);
  }

  .post-head{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-bottom:13px;
    padding-bottom:9px;

    border-bottom:1px solid var(--line-soft);
  }

  .post-author{
    color:var(--accent-soft);

    font-family:var(--display);
    font-size:17px;
    font-weight:600;
  }

  .post-time{
    color:var(--muted);

    font-family:var(--mono);
    font-size:9px;
  }

  .post-body{
    color:var(--parchment-soft);

    font-family:var(--body);
    font-size:14px;

    line-height:1.8;
  }

  .bbcode-content{
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  .bbcode-content blockquote{
    margin:14px 0;
    padding:10px 14px;
    border-left:2px solid var(--accent);
    background:var(--void-soft);
    color:var(--muted-light);
  }

  .bbcode-content a{
    color:var(--accent-soft);
    text-decoration:underline;
    text-underline-offset:2px;
  }

  .bbcode-image{
    display:block;
    max-width:100%;
    height:auto;
    margin:12px auto;
    border-radius:var(--radius);
  }

  .dohtml-frame{
    display:block;
    width:100%;
    min-height:80px;
    margin:12px 0;
    border:0;
    background:transparent;
    overflow:hidden;
  }

  textarea,
  .composer textarea{
    width:100%;
    min-height:125px;

    padding:13px 14px;

    border:1px solid var(--line);
    border-radius:var(--radius);

    background:var(--void-soft);
    color:var(--parchment);

    font-family:var(--body);
    font-size:14px;

    resize:vertical;
  }

  textarea:hover{
    border-color:var(--accent);
  }

  textarea:focus-visible{
    border-color:var(--accent);
  }

  .composer{
    margin-top:28px;
  }

  .composer-foot{
    display:flex;
    align-items:center;
    justify-content:space-between;

    margin-top:10px;
  }

  .hint{
    color:var(--muted);

    font-family:var(--mono);
    font-size:9px;
  }

  /* ---------- store ---------- */

  .store-grid{
    display:grid;

    grid-template-columns:
      repeat(auto-fill,minmax(215px,1fr));

    gap:12px;
  }

  .item-card{
    display:flex;
    flex-direction:column;

    gap:10px;

    padding:19px;

    border:1px solid var(--line-soft);
    border-radius:var(--radius-large);

    background:var(--panel);

    transition:
      border-color .2s ease,
      transform .2s ease;
  }

  .item-card:hover{
    border-color:var(--accent);
    transform:translateY(-2px);
  }

  .item-icon{
    font-size:25px;
  }

  .item-name{
    color:var(--parchment);

    font-family:var(--display);
    font-size:20px;
  }

  .item-desc{
    flex-grow:1;

    color:var(--muted);

    font-size:12px;
    line-height:1.6;
  }

  .item-price{
    color:var(--gold-bright);

    font-family:var(--mono);
    font-size:11px;
  }

  /* ---------- modal ---------- */

  .modal-backdrop{
    position:fixed;
    inset:0;
    z-index:50;

    display:none;
    align-items:center;
    justify-content:center;

    padding:20px;

    background:rgba(5,3,4,.77);

    backdrop-filter:blur(6px);
  }

  .modal-backdrop.visible{
    display:flex;
  }

  .modal{
    width:100%;
    max-width:500px;

    padding:28px;

    border:1px solid var(--line);
    border-radius:var(--radius-large);

    background:var(--panel);

    box-shadow:var(--shadow);
  }

  .modal h3{
    margin:0 0 20px;

    color:var(--parchment);

    font-family:var(--display);
    font-size:26px;
    font-weight:600;
  }

  .modal-actions{
    display:flex;
    justify-content:flex-end;

    gap:9px;

    margin-top:18px;
  }

  .empty-state{
    padding:42px 0;

    color:var(--muted);

    font-family:var(--display);
    font-size:15px;
    font-style:italic;

    text-align:center;
  }

  .toast{
    position:fixed;

    bottom:24px;
    left:50%;
    z-index:100;

    padding:10px 16px;

    border:1px solid var(--accent);
    border-radius:var(--radius);

    background:var(--panel-raised);
    color:var(--parchment);

    box-shadow:var(--shadow-soft);

    font-size:12px;

    opacity:0;
    pointer-events:none;

    transform:translateX(-50%);

    transition:opacity .25s ease;
  }

  .toast.visible{
    opacity:1;
  }

  /* ---------- admin ---------- */

  .admin-block{
    margin-top:35px;
    padding-top:24px;

    border-top:1px solid var(--line-soft);
  }

  .admin-block h3{
    margin:0 0 14px;

    color:var(--parchment);

    font-family:var(--display);
    font-size:21px;
    font-weight:600;
  }

  .inline-form{
    display:flex;
    flex-wrap:wrap;

    gap:8px;

    margin-bottom:10px;
  }

  .inline-form input{
    flex:1;
    min-width:120px;
  }

  /* ---------- dropdown navigation ---------- */

  main.layout{
    display:block;
    min-height:0;
  }

    banner.style.display = 'block';

    if (
      e.message === 'Script error.' &&
      e.lineno === 0
    ){

      banner.textContent =
        'A script failed silently (likely blocked by an ad-blocker, privacy extension, or content blocker). Try disabling it for this site, or try a different browser like Chrome or Firefox without extensions.';

    } else {

      banner.textContent =
        'Script error: ' +
        e.message +
        ' (line ' +
        e.lineno +
        ')';

    }
  }
});

    /\[url=([^\]\r\n]+)\]([\s\S]*?)\[\/url\]/gi,
    (match, value, label) => {

      return `<img class="bbcode-image" src="${esc(url)}" alt="User-posted image" loading="lazy">`;

      sendHeight();
    })();
  `;

  return `<!doctype html>
    <html>
      <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <style>
          html,body{margin:0;padding:0;min-width:0;background:transparent;}
          *,*::before,*::after{box-sizing:border-box;}
          img{max-width:100%;}
        </style>
      </head>
      <body>
        ${content}
        <script>${resizeScript}<\/script>
      </body>
    </html>`;
}

function createDoHtmlFrame(source, postId, blockIndex){

  const frameId =
    `dohtml-${postId}-${blockIndex}`;

  const frame =
    document.createElement('iframe');

  frame.className =
    'dohtml-frame';

  frame.dataset.dohtmlFrameId =
    frameId;

  frame.title =
    'Custom formatted post content';

  frame.setAttribute(
    'sandbox',
    'allow-scripts'
  );

  frame.setAttribute(
    'referrerpolicy',
    'no-referrer'
  );

  doHtmlFrames.set(
    frameId,
    frame
  );

  frame.srcdoc =
    buildDoHtmlDocument(
      source,
      frameId
    );

  return frame;
}

function renderPostContent(element, source, postId){

  const content =
    String(source ?? '');

  const fragment =
    document.createDocumentFragment();

  const doHtmlPattern =
    /\[dohtml\]([\s\S]*?)\[\/dohtml\]/gi;

  let cursor = 0;
  let blockIndex = 0;
  let match;

  while (
    (
      match =
        doHtmlPattern.exec(content)
    ) !== null
  ){

    if (match.index > cursor){

      const text =
        document.createElement('div');

      text.className =
        'bbcode-content';

      text.innerHTML =
        renderBbCode(
          content.slice(
            cursor,
            match.index
          )
        );

      fragment.append(text);
    }

    fragment.append(
      createDoHtmlFrame(
        match[1],
        postId,
        blockIndex
      )
    );

    blockIndex += 1;
    cursor =
      match.index +
      match[0].length;
  }

  if (
    cursor < content.length ||
    blockIndex === 0
  ){

    const text =
      document.createElement('div');

    text.className =
      'bbcode-content';

    text.innerHTML =
      renderBbCode(
        content.slice(cursor)
      );

    fragment.append(text);
  }

  element.replaceChildren(
    fragment
  );
}

function timeAgo(iso){

  const diff =
    (
      Date.now() -
      new Date(iso).getTime()
    ) / 1000;

  if (diff < 60){
    return 'just now';
  }

  if (diff < 3600){
    return Math.floor(diff / 60) + 'm ago';
  }

  if (diff < 86400){
    return Math.floor(diff / 3600) + 'h ago';
  }

  return Math.floor(diff / 86400) + 'd ago';
}

async function loadBoards(){

  const { data, error } =
    await sb
      .from('boards')
      .select('*')
      .order('sort_order', { ascending:true });

  if (error){
    console.error(error);
    return;
  }

  const seenNames = new Set();

  boards = (data || []).filter(board => {
    const normalizedName =
      (board.name || '').trim().toLowerCase();

    if (seenNames.has(normalizedName)){
      return false;
    }

    seenNames.add(normalizedName);
    return true;
  });

  renderBoardMenu();
}

async function loadPosts(threadId){

  const {
    data,
    error
  } =
    await sb
      .from('posts')
      .select(
        'id, content, created_at, profiles(username)'
      )
      .eq(
        'thread_id',
        threadId
      )
      .order(
        'created_at',
        {
          ascending:true
        }
      );

  const container =
    $('#posts-container');

  if (error){

    container.innerHTML =
      `<div class="empty-state">
        Couldn't load posts.
      </div>`;

    return;
  }

  container
    .querySelectorAll(
      '.dohtml-frame[data-dohtml-frame-id]'
    )
    .forEach(
      frame =>
        doHtmlFrames.delete(
          frame.dataset.dohtmlFrameId
        )
    );

  for (
    const [frameId, frame]
    of doHtmlFrames
  ){
    if (!frame.isConnected){
      doHtmlFrames.delete(frameId);
    }
  }

  container.innerHTML =
    data
      .map(
        (p, index) => `
          <div class="post-card">

            <div class="post-head">

              <span class="post-author">
                ${esc(
                  p.profiles?.username ||
                  'unknown'
                )}
              </span>

              <span class="post-time">
                ${timeAgo(
                  p.created_at
                )}
              </span>

            </div>

            <div
              class="post-body"
              data-post-index="${index}"
            ></div>

          </div>
        `
      )
      .join('');

  data.forEach(
    (post, index) => {

      const postBody =
        container.querySelector(
          `[data-post-index="${index}"]`
        );

      if (postBody){
        renderPostContent(
          postBody,
          post.content,
          post.id
        );
      }
    }
  );
}

      <div class="inline-form">

        <input
          type="text"
          id="admin-item-name"
          placeholder="Name"
        >

        <input
          type="text"
          id="admin-item-desc"
          placeholder="Description"
        >

        <input
          type="number"
          id="admin-item-price"
          placeholder="Price"
          min="0"
          style="max-width:100px;"
        >

        <input
          type="text"
          id="admin-item-icon"
          placeholder="Icon"
          style="max-width:100px;"
        >

        <button
          class="btn btn-gold"
          id="admin-item-submit"
        >
          Add
        </button>

      </div>

    </div>
  `;
}

function wireAdminStore(){

  const btn =
    $('#admin-item-submit');

  if (!btn){
    return;
  }

  btn.addEventListener(
    'click',
    async () => {

      const name =
        $('#admin-item-name')
          .value
          .trim();

      const description =
        $('#admin-item-desc')
          .value
          .trim();

      const price =
        Number(
          $('#admin-item-price')
            .value
        ) || 0;

      const icon =
        $('#admin-item-icon')
          .value
          .trim() ||
        '✦';

      if (!name){
        return;
      }

      const {
        error
      } =
        await sb
          .from('store_items')
          .insert({
            name,
            description,
            price,
            icon
          });

      if (error){

        showToast(
          error.message
        );

        return;
      }

      showToast(
        'Item added.'
      );

      showStore();
    }
  );
}

async function showInventory(){

  currentBoardId =
    null;

  setActiveSidebar({
    nav:'inventory'
  });

  setContent(`
    <div class="page-header">

      <div>

        <h2>
          Inventory
        </h2>

        <div class="desc">
          Things you've bought from the market.
        </div>

      </div>

    </div>

    <div
      id="inventory-grid"
      class="store-grid"
    ></div>
  `);

  const {
    data,
    error
  } =
    await sb
      .from('inventory')
      .select(
        'purchased_at, store_items(name, description, icon)'
      )
      .eq(
        'user_id',
        currentUser.id
      )
      .order(
        'purchased_at',
        {
          ascending:false
        }
      );

  const grid =
    $('#inventory-grid');

  if (error){

    grid.innerHTML =
      `<div class="empty-state">
        Couldn't load inventory.
      </div>`;

    return;
  }

  if (!data.length){

    grid.innerHTML =
      `<div class="empty-state">
        Nothing here yet. Visit the Market.
      </div>`;

    return;
  }

  grid.innerHTML =
    data
      .map(
        row => `
          <div class="item-card">

            <span class="item-icon">
              ${esc(
                row.store_items?.icon ||
                '✦'
              )}
            </span>

            <span class="item-name">
              ${esc(
                row.store_items?.name ||
                ''
              )}
            </span>

            <span class="item-desc">
              ${esc(
                row.store_items?.description ||
                ''
              )}
            </span>

            <span class="hint">
              Bought ${timeAgo(
                row.purchased_at
              )}
            </span>

          </div>
        `
      )
      .join('');
}

async function showVault(){

  currentBoardId = null;

  setActiveSidebar({ nav:'vault' });

  await refreshCurrency();

  const wallet = currentProfile?.currency ?? 0;
  const savings = currentProfile?.savings_currency ?? 0;

  setContent(`
    <div class="page-header">
      <div>
        <h2>Vault</h2>
        <div class="desc">
          Set currency aside until you want it again.
        </div>
      </div>
    </div>

    <div class="vault-shell">
      <div class="vault-card">
        <h3>Your Savings</h3>
        <p>
          Currency stored here is kept separate from your spending balance.
        </p>

        <div class="vault-balance">
          <span id="vault-balance">${savings}</span>
          <small>saved currency</small>
        </div>

        <div class="wallet-mini">
          <span>Available in wallet</span>
          <strong id="vault-wallet">${wallet} ✦</strong>
        </div>

        <div class="vault-form">
          <input
            type="number"
            id="vault-amount"
            min="1"
            step="1"
            placeholder="Amount"
            inputmode="numeric"
          >
        </div>

        <div class="vault-actions">
          <button class="btn btn-gold" id="vault-deposit">
            Deposit
          </button>

          <button class="btn btn-ghost" id="vault-withdraw">
            Withdraw
          </button>
        </div>
      </div>

      <div class="vault-note">
        <h4>Out of sight, out of mind.</h4>
        <p>
          Currency in the Vault stays separate from your normal spending balance,
          so it cannot accidentally disappear into the Market.
        </p>
        <p style="margin-top:12px;">
          Withdraw it whenever you're ready to spend it.
        </p>
      </div>
    </div>
  `);

  $('#vault-deposit').addEventListener('click', () => {
    transferVaultCurrency('deposit');
  });

  $('#vault-withdraw').addEventListener('click', () => {
    transferVaultCurrency('withdraw');
  });
}

async function transferVaultCurrency(type){

  const input = $('#vault-amount');
  const amount = Math.floor(Number(input.value));

  if (!Number.isFinite(amount) || amount <= 0){
    showToast('Enter a valid amount.');
    return;
  }

  const depositBtn = $('#vault-deposit');
  const withdrawBtn = $('#vault-withdraw');

  depositBtn.disabled = true;
  withdrawBtn.disabled = true;

  const rpcName =
    type === 'deposit'
      ? 'deposit_currency'
      : 'withdraw_currency';

  const { data, error } =
    await sb.rpc(rpcName, { amount_input: amount });

  depositBtn.disabled = false;
  withdrawBtn.disabled = false;

  if (error){
    console.error(error);
    showToast(error.message);
    return;
  }

  showToast(data?.message || 'Vault updated.');

  if (!data?.success){
    return;
  }

  input.value = '';

  await refreshCurrency();

  $('#vault-wallet').textContent =
    `${currentProfile.currency} ✦`;

  $('#vault-balance').textContent =
    currentProfile.savings_currency;
}
